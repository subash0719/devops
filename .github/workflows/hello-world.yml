name: Hello node
on: push
env:
  MY_ENV: wf_variable
jobs:
  hello:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18,20,22]
    env:
      MY_ENV2: job_variable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
         node-version: ${{ matrix.node }}
      - run: npm start
      - name: step_variable
        run: echo "${{env.MY_ENV}}"
      - name: job_variable
        run: echo "${{env.MY_ENV2}}"
  build-job:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: run a script
        run: echo "job2 depends on job1"
  deploy-job:
    needs: [build-job,hello]
    runs-on: ubuntu-latest
    steps:
      - name: run another script
        run: echo "job3 depends on job2 and job1"
    
