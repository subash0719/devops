name: Hello node
on: push
env:
  MY_ENV: wf_variable
jobs:
  hello:
    runs-on: ubuntu-latest
    env:
      MY_ENV2: job_variable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
      - run: npm start
      - name: step_variable
        run: echo "${{env.MY_ENV}}"
      - name: job_variable
        run: echo "${{env.MY_ENV2}}"
